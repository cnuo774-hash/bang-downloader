[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bang-downloader"
version = "0.3.0"
description = "A tiny local CLI and web UI for magnet links, torrent files, and HTTP downloads."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["aria2", "bittorrent", "download", "magnet", "torrent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = []

[project.scripts]
bang = "bang_downloader.cli:main"

[project.urls]
Issues = "https://github.com/bsnqwq/bang-downloader/issues"
Source = "https://github.com/bsnqwq/bang-downloader"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
bang_downloader = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
