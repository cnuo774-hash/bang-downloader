name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include private magnet links, torrent data, credentials, or personal paths.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal commands using placeholder download sources.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Bang, Python, aria2, and operating system versions.
    validations:
      required: true
