<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bang · 下载器</title>
<style>
:root{--ink:#1c2733;--muted:#72808c;--line:#dce5e8;--paper:#f7faf9;--accent:#e85d3f;--mint:#d9f0e7;--blue:#327b91}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1180px;margin:0 auto;padding:34px 28px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:42px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:21px;letter-spacing:.02em}.mark{width:35px;height:35px;background:var(--accent);color:#fff;display:grid;place-items:center;border-radius:11px;font-weight:900}.engine{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:#e6a239}.dot.on{background:#42a978}.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:62px;align-items:end;margin-bottom:36px}.eyebrow{color:var(--accent);font-size:12px;text-transform:uppercase;letter-spacing:.16em;font-weight:800}.hero h1{font:700 clamp(40px,6vw,70px)/.98 Georgia,serif;margin:13px 0 17px;letter-spacing:-.04em}.hero p{color:var(--muted);max-width:460px;margin:0}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:23px;box-shadow:0 16px 44px #1d3a4210}.drop{border:1.5px dashed #b8cbd0;border-radius:13px;padding:20px;display:flex;gap:14px;align-items:center;background:#fbfdfc;cursor:pointer}.drop:hover{border-color:var(--accent);background:#fff9f7}.drop-icon{font-size:27px}.drop strong{display:block}.drop small{color:var(--muted)}input[type=file]{display:none}.or{display:flex;align-items:center;gap:12px;color:#a2adb1;font-size:12px;margin:17px 0}.or:before,.or:after{content:"";height:1px;background:var(--line);flex:1}.field{display:flex;gap:9px}.field input{min-width:0;flex:1;border:1px solid var(--line);border-radius:10px;padding:12px 13px;font:inherit;outline:0}.field input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #327b9115}.btn{border:0;border-radius:10px;background:var(--ink);color:white;padding:0 17px;font-weight:700;cursor:pointer}.btn:hover{background:var(--accent)}.path{display:flex;gap:9px;margin-top:13px}.path input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font:inherit;background:#fbfdfc}.submit{width:100%;height:45px;margin-top:17px}.hint{font-size:12px;color:var(--muted);margin-top:11px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:30px 0 13px}.section-head h2{font-size:16px;margin:0}.count{color:var(--muted);font-size:13px}.tasks{display:grid;gap:10px}.task{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px 18px;display:grid;grid-template-columns:1fr 180px;gap:20px}.task-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:var(--muted);margin-top:5px}.bar{height:6px;background:#edf2f1;border-radius:9px;overflow:hidden;margin-top:13px}.fill{height:100%;background:var(--blue);border-radius:9px;transition:width .4s}.task-right{text-align:right;align-self:center}.status{display:inline-block;font-size:12px;padding:4px 8px;border-radius:20px;background:#edf4f1;color:#39806b}.status.error{background:#fff0ed;color:#c34e39}.status.waiting{background:#fff6df;color:#9a721d}.percent{display:block;font-size:25px;font-weight:700;margin-top:5px}.empty{text-align:center;padding:46px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:13px}.foot{margin-top:33px;font-size:12px;color:#a1abad}@media(max-width:760px){main{padding:22px 16px 50px}.top{margin-bottom:30px}.hero{display:block}.hero h1{font-size:48px}.panel{margin-top:25px}.task{grid-template-columns:1fr}.task-right{text-align:left}}
</style></head>
<body><main><header class="top"><div class="brand"><span class="mark">B</span>Bang Downloader</div><div class="engine"><i class="dot" id="engineDot"></i><span id="engineText">检查下载引擎…</span></div></header>
<section class="hero"><div><div class="eyebrow">Local transfer, clear mind</div><h1>把链接，<br>变成文件。</h1><p>一个安静、清晰的本地下载工作台。粘贴磁力链接，或拖入种子文件，选择保存位置后开始。</p></div>
<div class="panel"><label class="drop" for="torrent"><span class="drop-icon">↥</span><span><strong id="fileTitle">拖入 .torrent 文件</strong><small>支持单个种子文件，内容只保存在你的电脑</small></span></label><input id="torrent" type="file" accept=".torrent"><div class="or"><span>或者粘贴链接</span></div><div class="field"><input id="source" placeholder="magnet:?xt=urn:btih:…"><button class="btn" id="clear" type="button">清空</button></div><div class="path"><input id="target" placeholder="保存到本地路径，例如 ~/Downloads"><button class="btn" id="defaultPath" type="button">默认</button></div><button class="btn submit" id="add">添加到下载队列&nbsp; →</button><div class="hint" id="hint">磁力和种子下载需要本机安装 aria2c；HTTP 链接可直接下载。</div></div></section>
<div class="section-head"><h2>下载队列</h2><span class="count" id="count">0 个任务</span></div><section class="tasks" id="tasks"><div class="empty">还没有任务<br><small>从上方添加一个链接或种子文件</small></div></section><div class="foot">Bang runs locally on 127.0.0.1 · Your links and files are not uploaded to a third party.</div></main>
<script>
const $=s=>document.querySelector(s), file=$('#torrent');let selected=null;
file.onchange=()=>{selected=file.files[0]||null;$('#fileTitle').textContent=selected?selected.name:'拖入 .torrent 文件'};
$('#clear').onclick=()=>{$('#source').value='';selected=null;file.value='';$('#fileTitle').textContent='拖入 .torrent 文件'};
$('#defaultPath').onclick=()=>$('#target').value='~/Downloads';
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function render(data){$('#engineDot').className='dot '+(data.engine?'on':'');$('#engineText').textContent=data.engine?'aria2c 已就绪':'未检测到 aria2c';$('#count').textContent=data.tasks.length+' 个任务';if(!data.tasks.length){$('#tasks').innerHTML='<div class="empty">还没有任务<br><small>从上方添加一个链接或种子文件</small></div>';return}$('#tasks').innerHTML=data.tasks.slice().reverse().map(t=>`<article class="task"><div><div class="task-name">${esc(t.name)}</div><div class="meta">${esc(t.kind)} · ${esc(t.target)} · ${esc(t.message)}</div><div class="bar"><div class="fill" style="width:${t.progress||0}%"></div></div></div><div class="task-right"><span class="status ${t.status}">${({queued:'排队中',downloading:'下载中',completed:'已完成',error:'失败',waiting:'等待引擎'}[t.status]||t.status)}</span><span class="percent">${t.progress==null?'—':Math.round(t.progress)+'%'}</span></div></article>`).join('')}
async function refresh(){try{render(await (await fetch('/api/status')).json())}catch(e){}}
function toBase64(buffer){const bytes=new Uint8Array(buffer),size=0x8000;let binary='';for(let i=0;i<bytes.length;i+=size)binary+=String.fromCharCode(...bytes.subarray(i,i+size));return btoa(binary)}
$('#add').onclick=async()=>{let source=$('#source').value.trim(),payload={source,target:$('#target').value.trim()};if(selected){if(selected.size>12*1024*1024){$('#hint').textContent='种子文件不能超过 12 MB';return}payload.file_name=selected.name;payload.file_data=toBase64(await selected.arrayBuffer())}if(!source&&!selected){$('#hint').textContent='请先粘贴 magnet 链接或选择 .torrent 文件';return}$('#add').disabled=true;try{const response=await fetch('/api/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),result=await response.json();if(!response.ok){$('#hint').textContent=result.error||'添加任务失败';return}$('#source').value='';selected=null;file.value='';$('#fileTitle').textContent='拖入 .torrent 文件';$('#hint').textContent='任务已添加';refresh()}catch(e){$('#hint').textContent='无法连接到本地服务'}finally{$('#add').disabled=false}};refresh();setInterval(refresh,1200);
</script></body></html>
